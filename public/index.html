<!DOCTYPE html>
<html lang="sv-SE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Tells the UA which schemes the app supports, so native controls,
       scrollbars and the time picker follow prefers-color-scheme instead of
       staying light against a dark theme. Must precede first paint. -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#6B4E16" id="theme-color">
  <meta name="description" content="Luthers Rosenkrans — Be rosenkransen på svenska">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rosenkrans">
  <title>Luthers Rosenkrans</title>
  <!-- Render-critical faces only. `crossorigin` is mandatory even for
       same-origin fonts (they are fetched in CORS mode) — omitting it makes the
       browser fetch each font twice. -->
  <link rel="preload" href="/fonts/fraunces-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/alegreya-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body data-liturgical-color="vit">
  <a class="skip-link" href="#app">Hoppa till innehållet</a>

  <noscript>
    <p class="noscript-note">
      Den här appen behöver JavaScript för att fungera. Aktivera JavaScript och
      ladda om sidan.
    </p>
  </noscript>

  <header class="app-bar" role="banner">
    <div class="app-bar__row">
      <h1 class="wordmark">Luthers Rosenkrans</h1>
      <p class="season-chip">
        <span class="season-chip__dot" aria-hidden="true"></span>
        <span class="season-chip__labels">
          <span id="season-name" class="season-chip__season">Kyrkoåret</span>
          <span id="observance-name" class="season-chip__day"></span>
        </span>
      </p>
    </div>
    <nav class="nav" aria-label="Huvudnavigation">
      <button id="nav-home" class="nav__item" type="button" aria-current="page">Hem</button>
      <button id="nav-settings" class="nav__item" type="button">Inställningar</button>
      <button id="nav-sources" class="nav__item" type="button">Källor</button>
    </nav>
  </header>

  <main id="app" class="app-main" role="main">
    <p>Laddar…</p>
  </main>

  <footer class="app-footer" role="contentinfo">
    <p><small>© Svenska Kärnbibeln — CC BY-NC-SA 4.0</small></p>
  </footer>
</body>
</html>
